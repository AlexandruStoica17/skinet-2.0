<div class="container mt-5 mb-5">

    <!-- Page header -->
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold">
                <i class="fa fa-star text-warning me-2"></i>What's New
            </h2>
            <p class="text-muted">Discover the latest products added to our platform</p>
            <hr>
        </div>
    </div>

    <!-- Loading spinner -->
    <div *ngIf="loading" class="text-center mt-5">
        <i class="fa fa-spinner fa-spin fa-3x text-muted"></i>
    </div>

    <!-- Products grid -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4" *ngIf="!loading">

        <!-- Product card — standalone, no dependency on ProductItemComponent -->
        <div class="col" *ngFor="let product of recentProducts">
            <div class="card h-100 shadow-sm border-0">
                <!-- NEW badge -->
                <div class="position-relative">
                    <img [src]="product.pictureUrl" [alt]="product.name"
                         class="card-img-top"
                         style="height: 200px; object-fit: cover;">
                    <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-2">
                        New
                    </span>
                </div>

                <div class="card-body d-flex flex-column">
                    <h6 class="card-title fw-bold text-truncate mb-1">{{ product.name }}</h6>
                    <p class="text-muted small mb-1">{{ product.productType }}</p>
                    <p class="text-success fw-bold fs-5 mb-1">{{ product.price | currency }}</p>
                    <p class="text-muted small mb-0" *ngIf="product.producerName">
                        <i class="fa fa-store me-1"></i>{{ product.producerName }}
                    </p>
                </div>

                <div class="card-footer bg-white border-0 pb-3">
                    <a [routerLink]="['/shop', product.id]"
                       class="btn btn-outline-primary w-100 btn-sm">
                        View Product
                    </a>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="recentProducts.length === 0 && !loading"
             class="col-12 text-center text-muted mt-5">
            <i class="fa fa-box-open fa-3x mb-3 d-block"></i>
            <p>No products available yet.</p>
        </div>

    </div>
</div>
