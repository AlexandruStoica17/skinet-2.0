<header class="d-flex flex-row align-items-center justify-content-between p-3 px-4 mb-3
 bg-white border-bottom fixed-top shadow-sm">

    <img src="/assets/images/logo.png" alt="logo" class="logo" style="max-height: 70px;" routerLink="/">

    <nav class="my-2 text-uppercase fs-4">
        <a class="p-2" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a class="p-2" routerLink="/shop" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Shop</a>
        <a class="p-2" routerLink="/test-error" routerLinkActive="active">Errors</a>

        <a class="p-2" *ngIf="(accountService.currentUser$ | async)" routerLink="/favorites"
            routerLinkActive="active">Favorites</a>

        <a class="p-2" routerLink="/blog" routerLinkActive="active">Blog</a>
    </nav>

    <div class="d-flex align-items-center">

        <!-- Coșul de cumpărături (existent) -->
        <a routerLink="/basket" class="position-relative me-4">
            <i class="fa fa-shopping-cart fa-2x text-dark"></i>
            <div *ngIf="(basketService.basketSource$ | async) as basket" class="cart-no">
                {{getCount(basket.items)}}
            </div>
        </a>

        <!-- ICONIȚA DE MESAJE — vizibilă doar când ești logat -->
        <a routerLink="/chat"
           class="position-relative me-5"
           *ngIf="(accountService.currentUser$ | async)"
           title="Mesaje">
            <i class="fa fa-comments fa-2x text-dark"></i>
            <!-- Badge cu numărul de mesaje necitite -->
            <div class="msg-badge"
                 *ngIf="(messageService.unreadCount$ | async) as unread">
                <span *ngIf="unread > 0">{{unread > 99 ? '99+' : unread}}</span>
            </div>
        </a>

        <ng-container *ngIf="(accountService.currentUser$ | async) === null">
            <a routerLink="/account/login" class="btn btn-outline-secondary me-2">Login</a>
            <a routerLink="/account/register" class="btn btn-outline-secondary me-3">Sign up</a>
        </ng-container>

        <ng-container *ngIf="accountService.currentUser$ | async as user">
            <div class="dropdown ms-3 me-5" style="cursor: pointer;" dropdown>
                <a dropdownToggle class="dropdown-toggle">
                    <strong>Welcome {{user.displayName}}</strong>
                </a>

                <ul *dropdownMenu class="dropdown-menu dropdown-menu-right">
                    <li class="py-1">
                        <a routerLink="/basket" class="dropdown-item">
                            <i class="fa fa-shopping-cart me-3"></i> View basket
                        </a>
                    </li>
                    <li class="py-1">
                        <a routerLink="/account/profile" class="dropdown-item">
                            <i class="fa fa-user-circle-o me-3"></i> Profilul Meu
                        </a>
                    </li>
                    <li class="py-1">
                        <a routerLink="/orders" class="dropdown-item">
                            <i class="fa fa-history me-3"></i> View orders
                        </a>
                    </li>
                    <!-- MESAJE în dropdown -->
                    <li class="py-1">
                        <a routerLink="/chat" class="dropdown-item">
                            <i class="fa fa-comments me-3"></i> Mesaje
                            <span class="badge bg-danger ms-1"
                                  *ngIf="(messageService.unreadCount$ | async) as unread">
                                <ng-container *ngIf="unread > 0">{{unread}}</ng-container>
                            </span>
                        </a>
                    </li>

                    <div class="dropdown-divider"></div>
                    <li class="py-1">
                        <a (click)="accountService.logout()" class="dropdown-item">
                            <i class="fa fa-sign-out me-3"></i> Log out
                        </a>
                    </li>

                    <ng-container *ngIf="(accountService.currentUser$ | async) as user">
                        <li class="nav-item" *ngIf="user.role?.includes('Admin')">
                            <a class="nav-link text-danger fw-bold" routerLink="/admin" routerLinkActive="active">
                                <i class="fa fa-cogs"></i> Admin Panel
                            </a>
                        </li>

                        <li class="nav-item"
                            *ngIf="(user.role?.includes('CosmeticsProducer') || user.role?.includes('IngredientsProducer')) && user.isVerified">
                            <a class="nav-link text-success fw-bold" routerLink="/add-product" routerLinkActive="active">
                                <i class="fa fa-plus-circle"></i> Adaugă Produs
                            </a>
                        </li>
                        <li class="nav-item"
                            *ngIf="(user.role?.includes('CosmeticsProducer') || user.role?.includes('IngredientsProducer')) && user.isVerified">
                            <a class="nav-link text-info fw-bold" routerLink="/my-products" routerLinkActive="active">
                                <i class="fa fa-box"></i> Produsele Mele
                            </a>
                        </li>
                        <li class="nav-item"
                            *ngIf="(user.role?.includes('CosmeticsProducer') || user.role?.includes('IngredientsProducer')) && user.isVerified">
                            <a class="nav-link" routerLink="/producer-orders" routerLinkActive="active">
                                <i class="fa fa-clipboard-list mr-1"></i>Comenzi Vânzător
                            </a>
                        </li>
                    </ng-container>
                </ul>
            </div>
        </ng-container>

    </div>
</header>
