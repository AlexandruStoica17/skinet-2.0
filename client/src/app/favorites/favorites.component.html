<div class="container favorites-page gb-page-offset mb-5" style="min-height: 500px;">
    <h2 class="mb-4">My Favorite Products</h2>
    
    <div class="row" *ngIf="products.length > 0">
        <div class="col-md-3 mb-4" *ngFor="let product of products">
            <!-- Adăugăm position-relative pentru a poziționa butonul de ștergere -->
            <div class="card h-100 shadow-sm position-relative">
                
                <!-- BUTONUL DE ȘTERGERE -->
                <button (click)="removeFavorite(product.id)" 
                        class="favorite-remove-button position-absolute"
                        title="Remove from favorites">
                    <i class="fa fa-trash"></i>
                </button>

                <img src="{{product.pictureUrl}}" alt="{{product.name}}" class="img-fluid bg-info">
                <div class="card-body d-flex flex-column">
                    <h6 class="text-uppercase">{{product.name}}</h6>
                    <span class="mb-2">{{product.price | currency}}</span>
                    
                    <button routerLink="/shop/{{product.id}}" class="gb-soft-btn w-100 mt-auto">
                        View Product
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row" *ngIf="products.length === 0">
        <div class="col-12 text-center mt-5">
            <h4>You do not have any favorite products yet.</h4>
            <p class="text-muted">Explore the shop and save the products you love!</p>
            <button routerLink="/shop" class="gb-soft-btn mt-3">Back to Shop</button>
        </div>
    </div>
</div>
