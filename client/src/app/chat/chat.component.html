<div class="container mt-4 mb-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4><i class="fa fa-comments me-2 text-primary"></i>Mesaje</h4>
            </div>

            <!-- Loading -->
            <div *ngIf="loading" class="text-center mt-5">
                <i class="fa fa-spinner fa-spin fa-2x text-muted"></i>
            </div>

            <!-- Inbox gol -->
            <div *ngIf="!loading && conversations.length === 0" class="card shadow-sm">
                <div class="card-body text-center py-5 text-muted">
                    <i class="fa fa-comment-o fa-3x mb-3"></i>
                    <p>Nu ai nicio conversație încă.</p>
                    <p class="small">Contactează un vânzător de pe pagina unui produs.</p>
                </div>
            </div>

            <!-- Lista conversatii -->
            <div class="list-group shadow-sm" *ngIf="!loading && conversations.length > 0">
                <a
                    *ngFor="let conv of conversations"
                    class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                    style="cursor: pointer;"
                    (click)="openConversation(conv.partnerEmail)">

                    <div class="d-flex align-items-center">
                        <!-- Avatar placeholder cu initiala -->
                        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-3"
                             style="width: 48px; height: 48px; font-size: 1.2em; flex-shrink: 0;">
                            {{ conv.partnerName?.charAt(0)?.toUpperCase() }}
                        </div>

                        <div>
                            <div class="fw-bold">{{ conv.partnerName }}</div>
                            <div class="text-muted small text-truncate" style="max-width: 300px;">
                                {{ conv.lastMessage }}
                            </div>
                        </div>
                    </div>

                    <div class="text-end">
                        <div class="text-muted small mb-1">
                            {{ conv.lastMessageSent | date:'d MMM, HH:mm' }}
                        </div>
                        <!-- Badge mesaje necitite -->
                        <span class="badge bg-danger rounded-pill" *ngIf="conv.unreadCount > 0">
                            {{ conv.unreadCount }}
                        </span>
                    </div>

                </a>
            </div>

        </div>
    </div>
</div>
