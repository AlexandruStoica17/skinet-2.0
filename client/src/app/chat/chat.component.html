<div class="container mt-4 mb-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <!-- HEADER: Zona de conectare -->
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fa fa-comments me-2"></i>Live Chat</h5>
                    
                    <div class="d-flex" *ngIf="!connected">
                        <input type="text" class="form-control form-control-sm me-2" placeholder="Email-ul celuiălalt user" [(ngModel)]="recipientUsername">
                        <button class="btn btn-light btn-sm text-primary" (click)="connectToChat()">Conectare</button>
                    </div>
                    
                    <div *ngIf="connected">
                        <span class="badge bg-success me-2">Conectat cu {{recipientUsername}}</span>
                        <button class="btn btn-danger btn-sm" (click)="connected = false; messageService.stopHubConnection()">Ieșire</button>
                    </div>
                </div>

                <!-- BODY: Istoricul Mesajelor -->
                <div class="card-body chat-body bg-light" *ngIf="connected">
                    <div *ngIf="(messageService.messageThread$ | async)?.length === 0" class="text-center text-muted mt-5">
                        <p>Niciun mesaj încă. Scrie ceva pentru a sparge gheața!</p>
                    </div>

                    <ul class="list-unstyled">
                        <li *ngFor="let msg of (messageService.messageThread$ | async)">
                            <!-- Logica de a pune mesajele la stânga (primite) sau dreapta (trimise) -->
                            <div class="d-flex mb-3" 
                                 [class.justify-content-end]="msg.senderUsername === currentUsername" 
                                 [class.justify-content-start]="msg.senderUsername !== currentUsername">
                                
                                <div class="chat-bubble p-3 rounded" 
                                     [class.bg-primary]="msg.senderUsername === currentUsername" 
                                     [class.text-white]="msg.senderUsername === currentUsername" 
                                     [class.bg-white]="msg.senderUsername !== currentUsername"
                                     [class.border]="msg.senderUsername !== currentUsername">
                                    <p class="mb-1">{{msg.content}}</p>
                                    <small [class.text-light]="msg.senderUsername === currentUsername" [class.text-muted]="msg.senderUsername !== currentUsername" style="font-size: 0.75em;">
                                        <i class="fa fa-clock-o me-1"></i>{{msg.messageSent | date:'short'}}
                                    </small>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- FOOTER: Scrierea unui mesaj nou -->
                <div class="card-footer" *ngIf="connected">
                    <form #messageForm="ngForm" (ngSubmit)="sendMessage()" autocomplete="off">
                        <div class="input-group">
                            <input type="text" name="messageContent" class="form-control form-control-lg" placeholder="Scrie un mesaj..." [(ngModel)]="messageContent" required>
                            <button class="btn btn-primary" type="submit" [disabled]="!messageForm.valid">
                                <i class="fa fa-paper-plane"></i> Trimite
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Mesaj dacă nu ești conectat -->
                <div class="card-body text-center mt-5 mb-5" *ngIf="!connected">
                    <h4>Introduceți email-ul utilizatorului cu care doriți să vorbiți în bara de sus pentru a începe chat-ul.</h4>
                </div>

            </div>
        </div>
    </div>
</div>
