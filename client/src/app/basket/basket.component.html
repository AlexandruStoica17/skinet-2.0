<div class="container basket-page gb-page-offset">
    <div *ngIf="(basketService.basketSource$ | async) === null">
        <p class="basket-empty-message">No items in basket</p>
    </div>

    <ng-container *ngIf="(basketService.basketSource$ | async) as basket">

        <div class="container">
            <div class="row">
                <app-basket-summary
                 (addItem)="incrementQuantity($event)"
                 (removeItem)="removeItem($event)">
                    
                </app-basket-summary>
            </div>

             <div class="row">
                    <div class="col-6 offset-6">
                        <app-order-totals></app-order-totals>
                        <a routerLink="/checkout" class="gb-soft-btn py-2 btn-block">
                            Proceed to checkout
                        </a>
                    </div>
                </div>
        </div>
    </ng-container>

</div>
