<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4"><i class="fa fa-users-cog me-2"></i>Producer Admin Panel</h2>
            
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>User</th>
                                <th>Company</th>
                                <th>Roles</th>
                                <th>Document</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let user of users">
                                <td>
                                    <div class="fw-bold">{{user.displayName}}</div>
                                    <div class="small text-muted">{{user.email}}</div>
                                </td>
                                <td>{{user.companyName || 'N/A'}}</td>
                                <td>
                                    <span *ngFor="let role of user.roles" class="badge bg-info me-1">{{role}}</span>
                                </td>
                                <td>
                                    <!-- Aici punem linkul către actul trimis de el, dacă există -->
                                    <a *ngIf="user.documentUrl" [href]="'https://localhost:5001/' + user.documentUrl" 
                                       target="_blank" class="btn btn-sm btn-outline-secondary">
                                        <i class="fa fa-file-pdf-o"></i> View Documents
                                    </a>
                                    <span *ngIf="!user.documentUrl" class="text-muted small">Missing</span>
                                </td>
                                <td>
                                    <span [class]="user.isVerified ? 'badge bg-success' : 'badge bg-warning text-dark'">
                                        {{user.isVerified ? 'Verified' : 'Pending'}}
                                    </span>
                                </td>
                                <td class="text-end">
                                    <!-- Butonul de aprobare apare doar dacă NU e verificat și dacă e producător -->
                                    <button 
                                        *ngIf="!user.isVerified && (user.roles.includes('CosmeticsProducer') || user.roles.includes('IngredientsProducer'))"
                                        (click)="approveUser(user.id)" 
                                        class="btn btn-sm btn-success">
                                        <i class="fa fa-check"></i> Approve
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
