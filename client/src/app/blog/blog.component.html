<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Blog</h2>

  <button
    *ngIf="isBlogger"
    class="btn btn-primary"
    routerLink="/blog/create">
    Create blog post
  </button>
</div>
<div class="container mt-5">
    <h2 class="mb-4">SkiNet Blog 🏂</h2>
    <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let post of posts">
            <div class="card shadow-sm h-100">
                <!-- Am adăugat (error) care prinde momentul în care poza pică și o înlocuiește cu un placeholder -->
                <img [src]="post.imageUrl" (error)="img.src='https://via.placeholder.com/400x200?text=SkiNet+Blog'" #img
                    class="card-img-top" alt="{{post.title}}" style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{post.title}}</h5>
                    <p class="text-muted small mb-2"><i class="fa fa-user me-1"></i> {{post.authorName}} |
                        {{post.createdAt | date:'mediumDate'}}</p>
                    <p class="card-text">{{post.summary}}</p>
                    <button routerLink="/blog/{{post.id}}" class="btn btn-outline-primary mt-auto w-100">
                        Citește articolul
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="posts.length === 0" class="text-center mt-5">
        <h4>Nu există articole momentan.</h4>
    </div>
</div>
