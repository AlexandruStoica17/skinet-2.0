<div class="container blog-edit-page mt-5 mb-5">
  <div class="blog-edit-hero">
    <div>
      <span class="eyebrow">Blogger dashboard</span>
      <h1>Edit blog post</h1>
      <p>Update your article title, cover image, sections and section images.</p>
    </div>

    <button
      type="button"
      class="btn btn-outline-secondary"
      routerLink="/blog/my-posts">
      Back to my posts
    </button>
  </div>

  <div class="text-center py-5" *ngIf="loading">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3 text-muted">Loading post...</p>
  </div>

  <div class="card blog-editor-card" *ngIf="!loading">
    <div class="card-body">
      <form [formGroup]="blogForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="form-label fw-bold">Post title</label>

          <input
            type="text"
            class="form-control form-control-lg"
            formControlName="title"
          >
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Cover image</label>

          <input
            type="file"
            class="form-control"
            accept="image/*"
            (change)="onCoverSelected($event)"
          >
        </div>

        <div class="cover-preview mb-4" *ngIf="coverPreview || existingCoverUrl">
          <img
            [src]="coverPreview || existingCoverUrl"
            alt="Cover image">

          <button
            type="button"
            class="btn btn-sm btn-danger remove-image-btn"
            (click)="removeCover()">
            ×
          </button>
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="mb-0">Article sections</h4>

          <button
            type="button"
            class="btn btn-outline-primary"
            (click)="addSection()">
            <i class="fa fa-plus me-1"></i>
            Add section
          </button>
        </div>

        <div
          class="section-editor mb-4"
          *ngFor="let section of sections; let i = index; trackBy: trackByIndex">

          <div class="section-header">
            <h5>Section {{ i + 1 }}</h5>

            <div class="d-flex gap-2">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                [disabled]="i === 0"
                (click)="moveSection(i, 'up')">
                ↑
              </button>

              <button
                type="button"
                class="btn btn-sm btn-outline-secondary"
                [disabled]="i === sections.length - 1"
                (click)="moveSection(i, 'down')">
                ↓
              </button>

              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                (click)="removeSection(i)">
                Remove
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Section heading</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="section.heading"
              [ngModelOptions]="{ standalone: true }"
            >
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Section text</label>

            <textarea
              class="form-control"
              rows="5"
              [(ngModel)]="section.text"
              [ngModelOptions]="{ standalone: true }">
            </textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Section image</label>

            <input
              type="file"
              class="form-control"
              accept="image/*"
              (change)="onSectionImageSelected($event, i)"
            >
          </div>

          <div class="section-image-preview mb-3" *ngIf="section.imagePreview || section.existingImageUrl">
            <img
              [src]="section.imagePreview || section.existingImageUrl"
              alt="Section image">

            <button
              type="button"
              class="btn btn-sm btn-danger remove-image-btn"
              (click)="removeSectionImage(i)">
              ×
            </button>
          </div>

          <div class="mb-2">
            <label class="form-label fw-bold">Image caption</label>

            <input
              type="text"
              class="form-control"
              [(ngModel)]="section.caption"
              [ngModelOptions]="{ standalone: true }"
            >
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <button
            type="button"
            class="btn btn-outline-danger"
            routerLink="/blog/my-posts">
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="submitting || !isArticleValid()">
            <i class="fa fa-save me-1"></i>
            {{ submitting ? 'Saving...' : 'Save changes' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
