<!-- MODIFICAT: cardul din Shop are același stil vizual ca în What's New,
     dar păstrează butoanele existente: basket, view, favorite. -->
<div class="card h-100 shadow-sm border-0 product-card" *ngIf="product">
  <div class="position-relative product-image-wrapper">
    <img
      [src]="product.pictureUrl"
      [alt]="product.name"
      class="card-img-top product-image"
    >

    <!-- Overlay păstrat pentru acțiunile din Shop -->
    <div class="d-flex align-items-center justify-content-center hover-overlay">
      <button
        type="button"
        (click)="addItemToBasket()"
        class="btn btn-primary fa fa-shopping-cart me-2"
        title="Add to basket">
      </button>

      <button
        type="button"
        [routerLink]="['/shop', product.id]"
        class="btn btn-primary me-2">
        View
      </button>

      <button
        type="button"
        (click)="addLike()"
        class="btn btn-danger"
        title="Add to favorites">
        <i class="fa fa-heart"></i>
      </button>
    </div>
  </div>

  <div class="card-body d-flex flex-column">
    <h6 class="card-title fw-bold text-truncate mb-1">
      {{ product.name }}
    </h6>

    <p class="text-muted small mb-1" *ngIf="product.productType">
      {{ product.productType }}
    </p>

    <p class="text-success fw-bold fs-5 mb-1">
      {{ product.price | currency }}
    </p>

    <p class="text-muted small mb-0 mt-auto" *ngIf="product.producerName">
      <i class="fa fa-store me-1"></i>{{ product.producerName }}
    </p>
  </div>
</div>
