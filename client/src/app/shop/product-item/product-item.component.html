<div class="card h-100 shadow-sm" *ngIf="product">

    <div class="image position-relative" style="cursor: pointer;"> 
        <img src="{{product.pictureUrl}}" alt="{{product.name}}" class="img-fluid bg-info">
        
        <!-- Zona de butoane care apare la hover -->
        <div class="d-flex align-items-center justify-content-center hover-overlay">
            <button (click)="addItemToBasket()" class="btn btn-primary fa fa-shopping-cart me-2"></button>
            
            <!-- Am adăugat me-2 aici pentru spațiere -->
            <button routerLink="/shop/{{product.id}}" class="btn btn-primary me-2">View</button>
            
            <!-- BUTONUL NOU DE FAVORITE -->
            <button (click)="addLike()" class="btn btn-danger">
                <i class="fa fa-heart"></i>
            </button>
        </div>
    </div>

    <div class="card-body d-flex flex-column">
        <a href="" class="text-decoration-none">
            <h6 class="text-uppercase">
                {{product.name}}
            </h6>
        </a>
        <span class="mb-2">{{product.price | currency}}</span>
    </div>
</div>
