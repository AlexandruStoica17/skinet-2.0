<div class="container">
    <div class="row" *ngIf="types.length > 0 && brands.length > 0">

        <!-- ── SIDEBAR ── -->
        <section class="col-3">

            <h5 class="text-warning ms-3">Sort</h5>
            <select class="form-select mb-4" (change)="onSortSelected($event)">
                <option *ngFor="let sort of sortOptions"
                        [selected]="shopParams.sort === sort.value"
                        [value]="sort.value">{{sort.name}}</option>
            </select>

            <!-- Brands -->
            <h5 class="text-warning ms-3">Brands</h5>
            <ul class="list-group my-3">
                <li class="list-group-item"
                    *ngFor="let brand of brands"
                    [class.active]="brand.id === shopParams.brandId"
                    (click)="onBrandSelected(brand.id)">
                    {{brand.name}}
                </li>
            </ul>

            <!-- Types -->
            <h5 class="text-warning ms-3">Types</h5>
            <ul class="list-group my-3">
                <li class="list-group-item"
                    *ngFor="let type of types"
                    [class.active]="type.id === shopParams.typeId"
                    (click)="onTypeSelected(type.id)">
                    {{type.name}}
                </li>
            </ul>

            <!-- Price Range -->
            <h5 class="text-warning ms-3 mt-3">Price</h5>
            <div class="px-3 mb-4">
                <div class="d-flex justify-content-between mb-1">
                    <span class="badge bg-primary">${{priceMin}}</span>
                    <span class="badge bg-primary">
                        {{priceMax >= PRICE_ABSOLUTE_MAX ? 'Any' : '$' + priceMax}}
                    </span>
                </div>
                <div class="position-relative price-range-wrapper">
                    <input type="range" class="form-range price-range"
                           min="0" [max]="PRICE_ABSOLUTE_MAX" step="10"
                           [value]="priceMin"
                           (input)="onMinPriceChange($event)">
                    <input type="range" class="form-range price-range price-range-max"
                           min="0" [max]="PRICE_ABSOLUTE_MAX" step="10"
                           [value]="priceMax"
                           (input)="onMaxPriceChange($event)">
                </div>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <input type="number" class="form-control form-control-sm text-center"
                           [value]="priceMin" min="0" [max]="priceMax"
                           (change)="priceMin = +$any($event.target).value; applyPriceFilter()">
                    <span class="text-muted">–</span>
                    <input type="number" class="form-control form-control-sm text-center"
                           [value]="priceMax" [min]="priceMin" [max]="PRICE_ABSOLUTE_MAX"
                           (change)="priceMax = +$any($event.target).value; applyPriceFilter()">
                    <button class="btn btn-sm btn-primary" (click)="applyPriceFilter()">
                        <i class="fa fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- MULTISELECT: Skin Type -->
            <h5 class="text-warning ms-3 mt-2">Skin Type</h5>
            <div class="px-3 mb-3">
                <div *ngFor="let opt of skinTypeOptions"
                     class="form-check filter-check"
                     (click)="toggleFilter('skinTypes', opt)">
                    <input type="checkbox" class="form-check-input"
                           [checked]="isSelected('skinTypes', opt)" readonly>
                    <label class="form-check-label">{{opt}}</label>
                </div>
            </div>

            <!-- MULTISELECT: Usage Area -->
            <h5 class="text-warning ms-3 mt-2">Usage Area</h5>
            <div class="px-3 mb-3">
                <div *ngFor="let opt of usageOptions"
                     class="form-check filter-check"
                     (click)="toggleFilter('usages', opt)">
                    <input type="checkbox" class="form-check-input"
                           [checked]="isSelected('usages', opt)" readonly>
                    <label class="form-check-label">{{opt}}</label>
                </div>
            </div>

            <!-- MULTISELECT: Benefits -->
            <h5 class="text-warning ms-3 mt-2">Benefits</h5>
            <div class="px-3 mb-3">
                <div *ngFor="let opt of benefitOptions"
                     class="form-check filter-check"
                     (click)="toggleFilter('benefits', opt)">
                    <input type="checkbox" class="form-check-input"
                           [checked]="isSelected('benefits', opt)" readonly>
                    <label class="form-check-label">{{opt}}</label>
                </div>
            </div>

            <!-- MULTISELECT: Formula -->
            <h5 class="text-warning ms-3 mt-2">Formula</h5>
            <div class="px-3 mb-3">
                <div *ngFor="let opt of formulaOptions"
                     class="form-check filter-check"
                     (click)="toggleFilter('formulas', opt)">
                    <input type="checkbox" class="form-check-input"
                           [checked]="isSelected('formulas', opt)" readonly>
                    <label class="form-check-label">{{opt}}</label>
                </div>
            </div>

            <!-- Rating -->
            <h5 class="text-warning ms-3 mt-2">Rating</h5>
            <ul class="list-group my-3">
                <li class="list-group-item"
                    [class.active]="shopParams.minRating === 0"
                    (click)="onRatingSelected(0)">All ratings</li>
                <li class="list-group-item"
                    *ngFor="let r of ratingOptions"
                    [class.active]="shopParams.minRating === r.value"
                    (click)="onRatingSelected(r.value)">{{r.label}}</li>
            </ul>

        </section>

        <!-- ── PRODUCTS ── -->
        <section class="col-9">
            <div class="d-flex justify-content-between align-items-center pb-2">
                <app-paging-header [totalCount]="totalCount"
                                   [pageNumber]="shopParams.pageNumber"
                                   [pageSize]="shopParams.pageSize">
                </app-paging-header>
                <div class="d-flex mt-2">
                    <input (keyup.enter)="onSearch()" type="text"
                           placeholder="Search" class="form-control me-2" #search>
                    <button (click)="onSearch()" class="btn btn-outline-primary mx-2">Search</button>
                    <button (click)="onReset()" class="btn btn-outline-primary">Reset</button>
                </div>
            </div>

            <div class="row row-cols-3 g-3 mb-4">
                <div class="col" *ngFor="let product of products">
                    <app-product-item [product]="product"></app-product-item>
                </div>
            </div>

            <div class="d-flex justify-content-center" *ngIf="totalCount > 0">
                <app-pager [totalCount]="totalCount"
                           [pageSize]="shopParams.pageSize"
                           [pageNumber]="shopParams.pageNumber"
                           (pageChanged)="onPageChanged($event)">
                </app-pager>
            </div>
        </section>

    </div>
</div>
