<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="mb-4">Edit Product</h3>

      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-bold">Product Name</label>
          <input type="text" class="form-control" formControlName="name">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" rows="5" formControlName="description">
          </textarea>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Price (RON)</label>
            <input type="number" class="form-control" formControlName="price">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Type</label>
            <select class="form-select" formControlName="productTypeId">
              <option value="" disabled>Choose type</option>
              <option *ngFor="let type of types" [value]="type.id">
                {{ type.name }}
              </option>
            </select>
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Brand</label>
            <select class="form-select" formControlName="productBrandId">
              <option value="" disabled>Choose brand</option>
              <option *ngFor="let brand of brands" [value]="brand.id">
                {{ brand.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- NOU: upload multiplu -->
        <div class="mb-4">
          <label class="form-label fw-bold">Add New Photos (Optional)</label>

          <input type="file" class="form-control" accept="image/*" multiple (change)="onFilesSelected($event)">

          <small class="text-muted">
            You can select multiple photos at once.
          </small>
        </div>

        <!-- NOU: poze noi selectate -->
        <div class="mb-4" *ngIf="imagePreviews.length > 0">
          <p class="text-muted mb-2">New selected photos:</p>

          <div class="row">
            <div class="col-6 col-md-3 mb-3" *ngFor="let preview of imagePreviews; let i = index">

              <div class="position-relative">
                <img [src]="preview" class="img-thumbnail w-100" style="height: 150px; object-fit: cover;">

                <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0"
                  (click)="removeSelectedImage(i)">
                  ×
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- NOU: poze actuale -->
       <div class="mb-4" *ngIf="existingPhotos.length > 0">
  <p class="text-muted mb-2">Current photos:</p>

  <div class="row">
    <div
      class="col-6 col-md-3 mb-3"
      *ngFor="let photo of existingPhotos; let i = index">

      <div class="photo-card">
        <img
          [src]="photo.url"
          class="img-thumbnail w-100 product-photo"
        >

        <div class="mt-2 d-flex justify-content-between gap-1">
          <button
            type="button"
            class="btn btn-sm btn-outline-primary"
            [disabled]="photo.isMain"
            (click)="setMainPhoto(photo.id)">
            Main
          </button>

          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [disabled]="i === 0"
            (click)="movePhoto(photo.id, 'up')">
            ↑
          </button>

          <button
            type="button"
            class="btn btn-sm btn-outline-secondary"
            [disabled]="i === existingPhotos.length - 1"
            (click)="movePhoto(photo.id, 'down')">
            ↓
          </button>

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            (click)="deletePhoto(photo.id)">
            ×
          </button>
        </div>

        <span class="badge bg-success mt-2" *ngIf="photo.isMain">
          Main photo
        </span>
      </div>
    </div>
  </div>
</div>

        <hr>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-danger" routerLink="/my-products">
            Cancel
          </button>

          <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
            <i class="fa fa-save me-1"></i>
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
