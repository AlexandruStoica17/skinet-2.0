<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <h3 class="mb-0 py-2"><i class="fa fa-plus-circle text-success me-2"></i>Adaugă Produs Nou</h3>
        </div>
        <div class="card-body p-4" *ngIf="productForm">
          <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group mb-3">
              <label class="form-label fw-bold">Nume Produs</label>
              <input type="text" class="form-control" formControlName="name" placeholder="Ex: Cremă de față hidratantă">
            </div>

            <div class="form-group mb-3">
              <label class="form-label fw-bold">Descriere</label>
              <textarea class="form-control" formControlName="description" rows="4" placeholder="Descrie produsul tău în câteva rânduri..."></textarea>
            </div>

            <div class="row mb-3">
              <div class="col-md-4 form-group">
                <label class="form-label fw-bold">Preț (RON)</label>
                <input type="number" step="1" class="form-control" formControlName="price" placeholder="0.00">
              </div>
              
              <div class="col-md-4 form-group">
                <label class="form-label fw-bold">Tip Produs</label>
                <select class="form-select form-control" formControlName="productTypeId">
                  <option value="" disabled selected>Alege tipul...</option>
                  <option *ngFor="let type of types" [value]="type.id">{{type.name}}</option>
                </select>
              </div>
              
              <div class="col-md-4 form-group">
                <label class="form-label fw-bold">Brand</label>
                <select class="form-select form-control" formControlName="productBrandId">
                  <option value="" disabled selected>Alege brandul...</option>
                  <option *ngFor="let brand of brands" [value]="brand.id">{{brand.name}}</option>
                </select>
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="form-label fw-bold">Poză Produs</label>
              <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
              
              <div class="mt-3 text-center" *ngIf="imagePreview">
                <p class="text-muted small mb-1">Previzualizare:</p>
                <img [src]="imagePreview" alt="Preview" class="img-thumbnail shadow-sm" style="max-height: 250px; border-radius: 8px;">
              </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end">
              <button type="button" class="btn btn-outline-secondary me-3" routerLink="/shop">Anulează</button>
              <button type="submit" class="btn btn-success" [disabled]="productForm.invalid || !selectedFile">
                <i class="fa fa-save me-2"></i> Publică Produsul
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
