<div class="container add-product-page gb-page-offset mb-5">
  <div class="row justify-content-center">
    <div class="col-md-9">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom">
          <h3 class="mb-0 py-2">
            Add New Product
          </h3>
        </div>

        <div class="card-body p-4" *ngIf="productForm">
          <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

            <!-- Basic Info -->
            <h6 class="text-muted text-uppercase fw-bold mb-3 mt-2">Basic Information</h6>

            <div class="form-group mb-3">
              <label class="form-label fw-bold">Product Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" formControlName="name"
                     placeholder="e.g. Rose Hip Facial Cream">
            </div>

            <div class="form-group mb-3">
              <label class="form-label fw-bold">Description <span class="text-danger">*</span></label>
              <textarea class="form-control" formControlName="description"
                        rows="4"
                        placeholder="Describe your product — ingredients, benefits, how to use..."></textarea>
            </div>

            <div class="row mb-3">
              <div class="col-md-4 form-group">
                <label class="form-label fw-bold">Price (RON) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text">RON</span>
                  <input type="number" step="0.01" class="form-control"
                         formControlName="price" placeholder="0.00">
                </div>
              </div>

              <div class="col-md-4 form-group">
                <label class="form-label fw-bold">Product Type <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="productTypeId">
                  <option value="" disabled selected>Choose type...</option>
                  <option *ngFor="let type of types" [value]="type.id">{{type.name}}</option>
                </select>
              </div>

              <!-- Brand selector: ONLY visible to Admin -->
              <div class="col-md-4 form-group" *ngIf="isAdmin">
                <label class="form-label fw-bold">Brand</label>
                <select class="form-select" formControlName="productBrandId">
                  <option value="">Auto (seller's name)</option>
                  <option *ngFor="let brand of brands" [value]="brand.id">{{brand.name}}</option>
                </select>
              </div>

              <!-- For regular sellers: show info about auto-brand -->
              <div class="col-md-4 form-group" *ngIf="!isAdmin">
                <label class="form-label fw-bold">Brand</label>
                <div class="form-control bg-light text-muted" style="cursor: default;">
                  Your name (auto-assigned)
                </div>
              </div>
            </div>

            <hr class="my-4">

            <!-- Product Filters — MULTISELECT -->
            <h6 class="text-muted text-uppercase fw-bold mb-3">Product Details & Filters</h6>
            <p class="text-muted small mb-3">
              Select all that apply. These help customers find your product.
            </p>

            <div class="row">

              <!-- Skin Type -->
              <div class="col-md-6 mb-4">
                <label class="form-label fw-bold">
                  Skin Type
                  <small class="text-muted fw-normal">(select multiple)</small>
                </label>
                <div class="filter-multiselect-box p-2 border rounded">
                  <div *ngFor="let opt of skinTypeOptions" class="form-check">
                    <input type="checkbox" class="form-check-input"
                           [id]="'skin_' + opt"
                           [checked]="isChecked(selectedSkinTypes, opt)"
                           (change)="selectedSkinTypes = toggleOption(selectedSkinTypes, opt)">
                    <label class="form-check-label" [for]="'skin_' + opt">{{opt}}</label>
                  </div>
                </div>
              </div>

              <!-- Usage Area -->
              <div class="col-md-6 mb-4">
                <label class="form-label fw-bold">
                  Usage Area
                  <small class="text-muted fw-normal">(select multiple)</small>
                </label>
                <div class="filter-multiselect-box p-2 border rounded">
                  <div *ngFor="let opt of usageOptions" class="form-check">
                    <input type="checkbox" class="form-check-input"
                           [id]="'usage_' + opt"
                           [checked]="isChecked(selectedUsages, opt)"
                           (change)="selectedUsages = toggleOption(selectedUsages, opt)">
                    <label class="form-check-label" [for]="'usage_' + opt">{{opt}}</label>
                  </div>
                </div>
              </div>

              <!-- Benefits -->
              <div class="col-md-6 mb-4">
                <label class="form-label fw-bold">
                  Benefits
                  <small class="text-muted fw-normal">(select multiple)</small>
                </label>
                <div class="filter-multiselect-box p-2 border rounded">
                  <div *ngFor="let opt of benefitOptions" class="form-check">
                    <input type="checkbox" class="form-check-input"
                           [id]="'benefit_' + opt"
                           [checked]="isChecked(selectedBenefits, opt)"
                           (change)="selectedBenefits = toggleOption(selectedBenefits, opt)">
                    <label class="form-check-label" [for]="'benefit_' + opt">{{opt}}</label>
                  </div>
                </div>
              </div>

              <!-- Formula -->
              <div class="col-md-6 mb-4">
                <label class="form-label fw-bold">
                  Formula / Texture
                  <small class="text-muted fw-normal">(select multiple)</small>
                </label>
                <div class="filter-multiselect-box p-2 border rounded">
                  <div *ngFor="let opt of formulaOptions" class="form-check">
                    <input type="checkbox" class="form-check-input"
                           [id]="'formula_' + opt"
                           [checked]="isChecked(selectedFormulas, opt)"
                           (change)="selectedFormulas = toggleOption(selectedFormulas, opt)">
                    <label class="form-check-label" [for]="'formula_' + opt">{{opt}}</label>
                  </div>
                </div>
              </div>

            </div>

            <hr class="my-4">

            <!-- Product Image -->
            <h6 class="text-muted text-uppercase fw-bold mb-3">Product Image</h6>
            <div class="form-group mb-4">
              <label class="form-label fw-bold">
                Upload Image <span class="text-danger">*</span>
              </label>
              <input type="file" class="form-control"
                     (change)="onFileSelected($event)" accept="image/*">
              <small class="text-muted">
                Recommended: square image, minimum 500×500px, JPG or PNG
              </small>
              <div class="mt-3 text-center" *ngIf="imagePreview">
                <p class="text-muted small mb-1">Preview:</p>
                <img [src]="imagePreview" alt="Preview"
                     class="img-thumbnail shadow-sm"
                     style="max-height: 250px; border-radius: 8px;">
              </div>
            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="gb-soft-btn"
                      routerLink="/shop">Cancel</button>
              <button type="submit" class="gb-soft-btn"
                      [disabled]="productForm.invalid || !selectedFile">
                Publish Product
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
